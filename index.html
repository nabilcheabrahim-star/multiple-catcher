<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Multiple Catcher</title>

    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #e8f0e5;
    color: #26382a;
    text-align: center;
    margin: 0;
    padding: 20px;
}

        h1 {
    color: #245c38;
    text-shadow: 2px 2px 0px #c5d8b8;
}

      #gameArea {
    width: 800px;
    max-width: 95%;
    height: 400px;
    margin: 20px auto;
    background-color: #245c38;
    border: 8px solid #8b5e3c;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 0 #5b3a24;
}
        #player {
            width: 100px;
            height: 35px;
           background-color: #f4d35e;
            color: #26382a;
            font-weight: bold;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <h1>MULTIPLE CATCHER</h1>

   <p>Catch the common multiples of 2 and 3!</p>
<p>Correct answer: +10 points | Wrong answer: -5 points</p>
<p>Use the LEFT and RIGHT arrow keys to move.</p>

    <h2>
        Score: <span id="score">0</span>
    </h2>
    <h2>Time: <span id="timer">60</span>s</h2>
    <h2>Lives: <span id="lives">3</span> ❤️</h2>
<h2 id="gameMessage"></h2>

    <div id="gameArea">

        <div id="player">
            CATCHER
        </div>

    </div>

    <script>
        const player =
            document.getElementById("player");

        let position = 50;
        let score = 0;

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "ArrowLeft") {
                    position -= 5;
                }

                if (event.key === "ArrowRight") {
                    position += 5;
                }

                position = Math.max(
                    8,
                    Math.min(92, position)
                );

                player.style.left = position + "%";

            }
        );

        // TEMPAT UNTUK PAPAR NOMBOR
const fallingNumbers = [];

// SENARAI NOMBOR
const numberList = [2, 3, 4, 6, 8, 9, 12, 15];

// HASILKAN NOMBOR BAHARU
function createFallingNumber() {
   

    const number = document.createElement("div");

    number.className = "falling-number";

    number.textContent =
        numberList[Math.floor(Math.random() * numberList.length)];

    number.style.position = "absolute";

    number.style.top = "0px";

    number.style.left = (10 + Math.random() * 80) + "%";

    number.style.backgroundColor = "#f4d35e";

    number.style.color = "#26382a";
    
    number.style.padding = "12px";

    number.style.borderRadius = "50%";

    number.style.fontWeight = "bold";
    number.style.fontSize = "18px";
    number.style.boxShadow = "0 2px 5px rgba(0,0,0,0.3)";

    number.style.width = "25px";

    number.style.height = "25px";

    number.style.display = "flex";

    number.style.alignItems = "center";

    number.style.justifyContent = "center";

    gameArea.appendChild(number);

    fallingNumbers.push({
        element: number,
        position: 0
    });
}

// HASILKAN NOMBOR SETIAP 1.5 SAAT
setInterval(createFallingNumber, 1500);

let timeLeft = 60;
let gameOver = false;
let lives = 3;

// KELAJUAN NOMBOR JATUH
const fallSpeed = 2;

// GERAKKAN NOMBOR KE BAWAH
function moveFallingNumbers() {
    if (gameOver) {
    return;
}

    for (let i = fallingNumbers.length - 1; i >= 0; i--) {

        const item = fallingNumbers[i];

        item.position += fallSpeed;

        item.element.style.top = item.position + "px";

// PERIKSA SAMA ADA CATCHER MENANGKAP NOMBOR
const numberRect = item.element.getBoundingClientRect();
const playerRect = player.getBoundingClientRect();

if (
    numberRect.bottom >= playerRect.top &&
    numberRect.top <= playerRect.bottom &&
    numberRect.right >= playerRect.left &&
    numberRect.left <= playerRect.right
) {
    const value = Number(item.element.textContent);

    // GANDAAN SEPUNYA BAGI 2 DAN 3
   if (value % 2 === 0 && value % 3 === 0) {

    score += 10;

} else {

    score = Math.max(0, score - 5);

    lives--;

    document.getElementById("lives").textContent = lives;

}

document.getElementById("score").textContent = score;

if (lives <= 0) {

    gameOver = true;

    clearInterval(gameTimer);

    gameMessage.textContent =
        "GAME OVER! Final Score: " + score;

}

item.element.remove();

fallingNumbers.splice(i, 1);

continue;
}
        

        // BUANG NOMBOR JIKA SUDAH SAMPAI KE BAWAH
        if (item.position > gameArea.clientHeight) {

            item.element.remove();

            fallingNumbers.splice(i, 1);

        }

    }

    requestAnimationFrame(moveFallingNumbers);

}

// MULAKAN ANIMASI
moveFallingNumbers();

// TIMER PERMAINAN


const timerDisplay = document.getElementById("timer");
const gameMessage = document.getElementById("gameMessage");

const gameTimer = setInterval(function () {
    timeLeft--;
    timerDisplay.textContent = timeLeft;

    if (timeLeft <= 0) {
        clearInterval(gameTimer);
        gameOver = true;

        gameMessage.textContent =
            "GAME OVER! Final Score: " + score;
    }
}, 1000);        
    </script>

</body>

</html>
