<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Multiple Catcher</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #101a35;
            color: white;
            text-align: center;
        }

        h1 {
            color: #64f0e4;
        }

        #gameArea {
            width: 800px;
            max-width: 95%;
            height: 400px;
            margin: 20px auto;
            background-color: #172644;
            border: 3px solid #64f0e4;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        #player {
            width: 100px;
            height: 35px;
            background-color: #64f0e4;
            color: #101a35;
            font-weight: bold;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <h1>MULTIPLE CATCHER</h1>

    <p>
        Catch the common multiples of 2 and 3!
    </p>

    <h2>
        Score: <span id="score">0</span>
    </h2>

    <div id="gameArea">

        <div id="player">
            CATCHER
        </div>

    </div>

    <script>
        const player =
            document.getElementById("player");

        let position = 50;

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "ArrowLeft") {
                    position -= 5;
                }

                if (event.key === "ArrowRight") {
                    position += 5;
                }

                position = Math.max(
                    8,
                    Math.min(92, position)
                );

                player.style.left = position + "%";

            }
        );

        // TEMPAT UNTUK PAPAR NOMBOR
const fallingNumbers = [];

// SENARAI NOMBOR
const numberList = [2, 3, 4, 6, 8, 9, 12, 15];

// HASILKAN NOMBOR BAHARU
function createFallingNumber() {

    const number = document.createElement("div");

    number.className = "falling-number";

    number.textContent =
        numberList[Math.floor(Math.random() * numberList.length)];

    number.style.position = "absolute";

    number.style.top = "0px";

    number.style.left = (10 + Math.random() * 80) + "%";

    number.style.backgroundColor = "#ffd166";

    number.style.color = "#101a35";

    number.style.padding = "12px";

    number.style.borderRadius = "50%";

    number.style.fontWeight = "bold";

    number.style.width = "25px";

    number.style.height = "25px";

    number.style.display = "flex";

    number.style.alignItems = "center";

    number.style.justifyContent = "center";

    gameArea.appendChild(number);

    fallingNumbers.push({
        element: number,
        position: 0
    });
}

// HASILKAN NOMBOR SETIAP 1.5 SAAT
setInterval(createFallingNumber, 1500);
    </script>

</body>

</html>
